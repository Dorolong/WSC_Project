<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WSC Optuna Queue</title>
<link rel="stylesheet" href="./css/tokens.css" />
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <h1>WSC Optuna Queue</h1>
      <p class="sub">Run personal Optuna searches on the shared WSC server.</p>
    </div>
    <nav class="top-links" aria-label="External links">
      <a href="https://wscproject-dmiusnw9kapxecz8irxpgw.streamlit.app/" target="_blank" rel="noopener">Streamlit App</a>
      <a href="https://github.com/Dorolong/WSC_Project" target="_blank" rel="noopener">Repository</a>
    </nav>
  </header>

  <main>
    <section id="gate" class="auth-panel">
      <div class="panel-head">
        <h2>Sign in</h2>
      </div>
      <div class="form-grid">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" />
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" />
        <label class="check-row">
          <input type="checkbox" id="rememberEmail" />
          <span>Remember email</span>
        </label>
        <button class="btn" id="loginBtn">Sign in</button>
        <p class="err" id="gateErr"></p>
      </div>
    </section>

    <section id="app" class="workspace" hidden>
      <div class="account-row">
        <span id="loggedInAs"></span>
        <button id="logoutBtn" class="link-button">Sign out</button>
      </div>

      <div class="view-tabs" role="tablist" aria-label="Views">
        <button class="tab is-active" id="tabOptuna" type="button">Optuna Search</button>
      </div>

      <section class="dashboard-grid" id="optunaView">
        <article class="card server-card">
          <div class="status-row">
            <strong>Server Status</strong>
            <span class="status-pill" id="statusPill">-</span>
          </div>
          <div class="bar-track"><div class="bar-fill" id="statusBar"></div></div>
          <p class="hint" id="statusText">Loading...</p>
          <div id="runningList" class="list-block"></div>
        </article>

        <article class="card run-card">
          <label for="nTrials">Trials</label>
          <div class="run-controls">
            <input type="number" id="nTrials" value="20" min="1" max="100" />
            <button class="btn" id="runBtn">Start Search</button>
          </div>
          <p class="err" id="runErr"></p>
        </article>

        <article class="card progress-card" id="myRunCard" hidden>
          <div class="status-row">
            <strong>My Search</strong>
            <span id="myRunStatus" class="soft-text"></span>
          </div>
          <div class="bar-track"><div class="bar-fill" id="myRunBar"></div></div>
          <p class="hint" id="myRunText"></p>
          <div id="myRunResult" class="result-box" hidden></div>
        </article>
      </section>
    </section>
  </main>
</div>

<script type="module" src="./js/nav.js"></script>
</body>
</html>
