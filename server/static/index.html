<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WSC Optuna Queue</title>
<!-- 파비콘이 없으면 브라우저가 매 로드마다 /favicon.ico 를 찾다가 404를 내고
     콘솔이 지저분해진다. 별도 파일 없이 data: URI 로 끝낸다.
     CSP 의 img-src 에 data: 가 허용돼 있어야 뜬다(Caddyfile 참고). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232F6F4E'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='white' font-family='sans-serif'%3EW%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./css/tokens.css" />
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <h1>WSC Optuna Queue</h1>
      <p class="sub">Run personal Optuna searches on the shared WSC server.</p>
    </div>
    <nav class="top-links" aria-label="External links">
      <a href="https://wscproject-dmiusnw9kapxecz8irxpgw.streamlit.app/" target="_blank" rel="noopener">Streamlit App</a>
      <a href="https://github.com/Dorolong/WSC_Project" target="_blank" rel="noopener">Repository</a>
    </nav>
  </header>

  <main>
    <section id="gate" class="auth-panel">
      <div class="panel-head">
        <h2>Sign in</h2>
      </div>
      <div class="form-grid">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" />
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" />
        <label class="check-row">
          <input type="checkbox" id="rememberEmail" />
          <span>Remember email</span>
        </label>
        <button class="btn" id="loginBtn">Sign in</button>
        <p class="err" id="gateErr"></p>
      </div>
    </section>

    <section id="app" class="workspace" hidden>
      <div class="account-row">
        <span id="loggedInAs"></span>
        <div class="action-row">
          <button id="releaseNotesBtn" class="link-button" type="button">Release Notes</button>
          <button id="tutorialBtn" class="link-button" type="button">Tutorial</button>
          <button id="historyBtn" class="link-button" type="button">History</button>
          <button id="codeViewerBtn" class="link-button" type="button">Code</button>
          <button id="logoutBtn" class="link-button">Sign out</button>
        </div>
      </div>

      <div class="view-tabs" role="tablist" aria-label="Views">
        <button class="tab is-active" id="tabSimulator" type="button">Simulator</button>
        <button class="tab" id="tabOptuna" type="button">Optuna Search</button>
      </div>

      <section class="dashboard-grid" id="simulatorView">
        <article class="card run-card">
          <div class="status-row">
            <strong>Simulation</strong>
            <span id="simStatus" class="soft-text"></span>
          </div>
          <div class="run-controls">
            <button class="btn" id="simRunBtn">Run Simulation</button>
            <button class="btn secondary" id="vehicleConfigBtn" type="button">Vehicle Settings</button>
          </div>
          <div class="bar-track"><div class="bar-fill" id="simBar"></div></div>
          <p class="hint" id="simText">Ready.</p>
          <p class="err" id="simErr"></p>
        </article>

        <article class="card map-card">
          <div class="status-row">
            <strong>Route Progress</strong>
            <span id="routePct" class="soft-text">0%</span>
          </div>
          <div class="route-map" id="routeMap">
            <img id="routeBg" alt="" />
            <svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" aria-label="Route map">
              <path id="routeBgPath" fill="none" vector-effect="non-scaling-stroke" />
              <path id="routeDrivenPath" fill="none" vector-effect="non-scaling-stroke" />
            </svg>
          </div>
        </article>

        <article class="card progress-card" id="simResultCard" hidden>
          <div class="metrics-grid" id="simMetrics"></div>
          <div id="simAnalysis" class="analysis-box"></div>
          <div id="simChart" class="chart-box"></div>
          <button class="btn secondary download-link" id="simSaveBtn" type="button" hidden>Save Result</button>
          <button class="btn download-link" id="simCsvBtn" type="button" hidden>Download CSV</button>
        </article>
      </section>

      <section class="dashboard-grid" id="optunaView" hidden>
        <article class="card server-card">
          <div class="status-row">
            <strong>Server Status</strong>
            <span class="status-pill" id="statusPill">-</span>
          </div>
          <div class="bar-track"><div class="bar-fill" id="statusBar"></div></div>
          <p class="hint" id="statusText">Loading...</p>
          <div id="runningList" class="list-block"></div>
        </article>

        <article class="card run-card">
          <label for="nTrials">Trials</label>
          <div class="run-controls">
            <input type="number" id="nTrials" value="20" min="1" max="100" />
            <button class="btn" id="runBtn">Start Search</button>
          </div>
          <p class="err" id="runErr"></p>
        </article>

        <article class="card progress-card" id="myRunCard" hidden>
          <div class="status-row">
            <strong>My Search</strong>
            <span id="myRunStatus" class="soft-text"></span>
          </div>
          <div class="bar-track"><div class="bar-fill" id="myRunBar"></div></div>
          <p class="hint" id="myRunText"></p>
          <div id="myRunResult" class="result-box" hidden></div>
        </article>
      </section>
    </section>
  </main>
</div>

<dialog class="modal" id="vehicleConfigDialog">
  <form method="dialog" class="modal-panel">
    <div class="status-row modal-head">
      <strong>Vehicle Settings</strong>
      <button class="link-button" id="vehicleConfigClose" type="button">Close</button>
    </div>
    <div class="view-tabs compact-tabs" id="vehicleConfigTabs"></div>
    <div class="config-grid" id="vehicleConfigFields"></div>
    <div class="ocv-table-wrap" id="ocvEditor" hidden>
      <table class="ocv-table">
        <thead><tr><th>SOC</th><th>V</th></tr></thead>
        <tbody id="ocvRows"></tbody>
      </table>
    </div>
    <p class="err" id="vehicleConfigErr"></p>
    <div class="modal-actions">
      <button class="btn secondary" id="vehicleConfigLoad" type="button">Load Saved</button>
      <button class="btn secondary" id="vehicleConfigSave" type="button">Save to Account</button>
      <button class="btn" id="vehicleConfigApply" type="button">Apply</button>
    </div>
  </form>
</dialog>

<dialog class="modal" id="auxDialog">
  <form method="dialog" class="modal-panel">
    <div class="status-row modal-head">
      <strong id="auxTitle"></strong>
      <button class="link-button" id="auxClose" type="button">Close</button>
    </div>
    <div id="auxBody" class="aux-body"></div>
  </form>
</dialog>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script type="module" src="./js/nav.js"></script>
</body>
</html>
