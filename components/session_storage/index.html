<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
  // Supabase 로그인 세션(refresh token)을 브라우저 localStorage에 보관하는
  // 보이지 않는 컴포넌트. route_animator와 같은 방식(공식 React 컴포넌트
  // 빌드 없이, Streamlit의 raw postMessage 프로토콜을 직접 사용)으로 만듦.
  //
  // app.py에서 이걸 부르는 방법 세 가지:
  //  1. session_storage()                          -> 저장된 토큰을 읽어서 반환 (자동 로그인 확인용)
  //  2. session_storage(save_token="...")           -> 새 토큰을 저장 (로그인/회원가입 성공 시)
  //  3. session_storage(action="clear")             -> 저장된 토큰 삭제 (로그아웃 시)
  const STORAGE_KEY = "wsc_supabase_refresh_token";

  function sendToStreamlit(type, extra) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
  }

  function onRender(args) {
    if (args.action === "clear") {
      localStorage.removeItem(STORAGE_KEY);
    } else if (args.save_token) {
      localStorage.setItem(STORAGE_KEY, args.save_token);
    }
    const current = localStorage.getItem(STORAGE_KEY);
    sendToStreamlit("streamlit:setComponentValue", { value: current });
    sendToStreamlit("streamlit:setFrameHeight", { height: 0 });
  }

  window.addEventListener("message", function (event) {
    const data = event.data;
    if (!data || !data.type) return;
    if (data.type === "streamlit:render") {
      onRender(data.args || {});
    }
  });

  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  sendToStreamlit("streamlit:setFrameHeight", { height: 0 });
</script>
</body>
</html>
