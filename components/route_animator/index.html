<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  #wrap { position: relative; width: 100%; height: 500px; }
  svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="wrap">
  <img id="bgImg" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;opacity:0.9;" />
  <svg id="svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
    <path id="bgPath" fill="none" stroke="gray" stroke-width="2" vector-effect="non-scaling-stroke" />
    <path id="drivenPath" fill="none" stroke="orange" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke" />
  </svg>
</div>

<script>
  const VB_W = 1000, VB_H = 700;
  let bounds = null;
  let bgDrawn = false;
  let animating = false;

  function project(lon, lat) {
    const x = (lon - bounds.minx) / (bounds.maxx - bounds.minx) * VB_W;
    const y = (bounds.maxy - lat) / (bounds.maxy - bounds.miny) * VB_H;
    return [x, y];
  }

  function pointsToPath(pts) {
    if (pts.length === 0) return "";
    return "M " + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ");
  }

  function sendToStreamlit(type, extra) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
  }
  function setFrameHeight(h) {
    sendToStreamlit("streamlit:setFrameHeight", { height: h });
  }

  function runAnimation(pts, durationSec) {
    animating = true;
    const duration = Math.max(1, durationSec) * 1000;

    function playOnce(startTime) {
      function step(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const idx = Math.max(0, Math.floor(t * (pts.length - 1)));
        document.getElementById("drivenPath").setAttribute("d", pointsToPath(pts.slice(0, idx + 1)));
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          // 경로 다 채운 뒤 1초 멈췄다가 다시 재생 (계산이 끝날 때까지 반복)
          setTimeout(function () {
            requestAnimationFrame(playOnce);
          }, 1000);
        }
      }
      requestAnimationFrame(step);
    }
    playOnce(performance.now());
  }

  function onRender(args) {
    bounds = args.bounds;

    if (args.bg_image) {
      document.getElementById("bgImg").src = args.bg_image;
    }
    if (!bgDrawn && args.bg_lon && args.bg_lon.length > 0) {
      const bgPts = args.bg_lon.map((lon, i) => project(lon, args.bg_lat[i]));
      document.getElementById("bgPath").setAttribute("d", pointsToPath(bgPts));
      bgDrawn = true;
    }

    if (args.final_lon && args.final_lon.length > 0) {
      // 실제 계산 완료 -> 진짜 도달 지점까지 애니메이션 없이 즉시 표시
      const pts = args.final_lon.map((lon, i) => project(lon, args.final_lat[i]));
      document.getElementById("drivenPath").setAttribute("d", pointsToPath(pts));
    } else if (!animating && args.route_lon && args.route_lon.length > 0) {
      const pts = args.route_lon.map((lon, i) => project(lon, args.route_lat[i]));
      runAnimation(pts, args.duration_sec || 15);
    }

    setFrameHeight(500);
  }

  window.addEventListener("message", function (event) {
    const data = event.data;
    if (!data || !data.type) return;
    if (data.type === "streamlit:render") {
      onRender(data.args || {});
    }
  });

  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  setFrameHeight(500);
</script>
</body>
</html>
