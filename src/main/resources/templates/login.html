<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
    <head>
        
          <meta http-equiv="content-type" content="text/html; charset=UTF-8"> 
        <meta charset="utf-8">
        <title>KUST 텔레메트리 로그인</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
		<link rel="stylesheet" th:href="@{/css/bootstrap-3.3.7/bootstrap.min.css}" />
         <style type="text/css">
            /* CSS used here will be applied after bootstrap.css */

body { 
 background: url('/img/login-background.jpg') no-repeat center center fixed; 
 -webkit-background-size: cover;
 -moz-background-size: cover;
 -o-background-size: cover;
 background-size: cover;
}

.panel-default {
 opacity: 0.9;
 margin-top:30px;
}
.form-group.last {
 margin-bottom:0px;
}
        </style>
    </head>
    <body>
                      
        <div class="container">
    <div class="row">
        <div class="col-md-4 col-md-offset-4">
            <div class="panel panel-default">
                <div class="panel-heading">
                  <strong>KUST 텔레메트리 로그인</strong>
                </div>
                <div class="panel-body">
                    <form class="form-horizontal" role="form" th:action="@{/login}" method="post">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-sm-3 control-label">
                            사용자명</label>
                        <div class="col-sm-9">
                            <input class="form-control" name="username" id="username" placeholder="사용자명" type="text">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="inputPassword3" class="col-sm-3 control-label">
                            비밀번호</label>
                        <div class="col-sm-9">
                            <input class="form-control" id="password" name="password" placeholder="비밀번호" type="password">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-offset-3 col-sm-9">
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" name="remember-me">
                                    로그인 상태 유지
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group last">
                        <div class="col-sm-offset-3 col-sm-9">
                            <button type="submit" class="btn btn-success btn-sm">
                                로그인</button>
                                 <button type="reset" class="btn btn-default btn-sm">
                                초기화</button>
                        </div>
                    </div>
                    </form>
                </div>
                <div class="panel-footer">
                <div th:if="${param.error}">
            사용자명 또는 비밀번호가 올바르지 않습니다.
        </div>
        <div th:if="${param.logout}">
            로그아웃 되었습니다.
        </div>
                    </div>
            </div>
        </div>
    </div>
</div>
    </body>
</html>
