	<body>

<script>

var prefix = '/';

function LogTeam(teamNumber) {
    
    $.ajax({
        type: 'GET',
        url:  prefix + '/laptracker.json?teamNumber=' + teamNumber,
        contentType: 'application/json; charset=utf-8',        
        dataType: 'text',
        async: false,
        error: function(result) {
        	alert("오류가 발생했습니다. IT 담당자에게 문의하세요.");
        },
        success: function(result) {        		
        		$("td#lastrecorded").text(result);
			}
        });        
    
}

</script>  
	
		<div th:replace="header :: menu"></div>
	
		<div class="container">
	
			<div class="row">
				
				<div class="span12">
					<h3>팀 트래커 - 출발선 통과 시 버튼을 누르세요</h3>
					
					<table>
						<tbody>
							<tr>
								<td id="lastrecorded" class="okay">마지막 기록된 팀: 없음</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<div class="row">
				
				<div class="span12">
					<h3>팀 번호</h3>					
					<table>
						<tbody>
							<tr>
								<td><button type='button' onclick='LogTeam(30)'>30</button></td>
								<td><button type='button' onclick='LogTeam(31)'>31</button></td>
								<td><button type='button' onclick='LogTeam(32)'>32</button></td>
								<td><button type='button' onclick='LogTeam(33)'>33</button></td>
							</tr>
						</tbody>
					</table>
				</div>							
				
			</div>
		
		<hr />
	
		<div th:replace="footer :: details"></div>
		
		</div>
